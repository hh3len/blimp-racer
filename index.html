<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"/>
  <title>Airship Racer</title>
</head>

<body>
  <h1>AMASS AIRSHIP // INTERACTIVE SIM</h1>

  <!-- Top down view of blimp (X-Y) -->
  <canvas id="cvTop"  width="600" height="400" style="border: 1px solid green;"></canvas>

  <script>
    const canvas = document.getElementById('cvTop');
    const ctx = canvas.getContext('2d');

    let x = 300;
    let y = 150;
    let speed = 0;
    let angle = 0;
    let score = 0;

    const keys = {
        up: false,
        down: false,
        left: false,
        right: false,
    };

    // Generate random target
    function newTarget() {
        return {
            x: Math.random() * 500 + 50,
            y: Math.random() * 200 + 50,
        };
    }

    let target = newTarget();

    document.addEventListener('keydown', function(e) {
        if (e.key === 'ArrowUp')    keys.up    = true;
        if (e.key === 'ArrowDown')  keys.down  = true;
        if (e.key === 'ArrowLeft')  keys.left  = true;
        if (e.key === 'ArrowRight') keys.right = true;
        e.preventDefault();
    });

    document.addEventListener('keyup', function(e) {
        if (e.key === 'ArrowUp')    keys.up    = false;
        if (e.key === 'ArrowDown')  keys.down  = false;
        if (e.key === 'ArrowLeft')  keys.left  = false;
        if (e.key === 'ArrowRight') keys.right = false;
    });

    // Simulate 2D motion
    function draw() {
        // Rotate blimp (left = CCW, right = CW)
        if (keys.left)  angle += 0.03;
        if (keys.right) angle -= 0.03;
        // Up = "forward", down = "backwards"
        if (keys.up)   speed += 0.1;
        if (keys.down) speed -= 0.1;

        // Apply "drag"
        speed *= 0.98;
          
        // Update position
        x += speed * Math.cos(angle);
        y += speed * Math.sin(angle);

        // Check if captured
        const dx = target.x - x;
        const dy = target.y - y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 30) {
            score++;
            target = newTarget();
        }

        // // Move according to input
        // if (keys.up)    y -= 2;
        // if (keys.down)  y += 2;
        // if (keys.left)  x -= 2;
        // if (keys.right) x += 2;

        // if (keys.up)    vy -= 0.1;
        // if (keys.down)  vy += 0.1;
        // if (keys.left)  vx -= 0.1;
        // if (keys.right) vx += 0.1;

        // // Apply "drag"
        // vx *= 0.98;
        // vy *= 0.98;

        // // Update position
        // x += vx;
        // y += vy;        

        // CLEAR CANVAS
        ctx.fillStyle = 'black';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // TARGET
        ctx.beginPath();
        ctx.arc(target.x, target.y, 30, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffd426';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.beginPath();
        const ds = 8;
        ctx.moveTo(target.x,    target.y - ds);
        ctx.lineTo(target.x + ds, target.y);
        ctx.lineTo(target.x,    target.y + ds);
        ctx.lineTo(target.x - ds, target.y);
        ctx.closePath();
        ctx.fillStyle = '#ffd426';
        ctx.fill();

        // BLIMP
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate(angle);

        // Body
        ctx.beginPath();
        ctx.ellipse(0, 0, 55, 22, 0, 0, Math.PI * 2);
        ctx.fillStyle = '#209148';
        ctx.fill();
        ctx.strokeStyle = '#2bff7e';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Nose highlight (indicates front)
        ctx.beginPath();
        ctx.ellipse(0, 0, 55, 22, 0, -Math.PI / 6, Math.PI / 6);
        ctx.lineTo(48, 0);
        ctx.closePath();
        ctx.fillStyle = '#ccffcc';
        ctx.fill();
        // ctx.strokeStyle = 'red';
        // ctx.lineWidth = 2;
        // ctx.stroke();

        // Left/right fins
        ctx.beginPath();
        ctx.moveTo(-38, -16);
        ctx.lineTo(-55, -42);
        ctx.lineTo(-50, -10);
        ctx.moveTo(-38, 16);
        ctx.lineTo(-55, 42);
        ctx.lineTo(-50, 10);
        ctx.closePath();

        ctx.fillStyle = '#0e4020';
        ctx.fill();
        ctx.strokeStyle = '#2bff7e';
        ctx.lineWidth = 1;
        ctx.stroke();

        // Top fin
        ctx.beginPath();
        ctx.moveTo(-37, 0);
        ctx.lineTo(-65, 0);
        ctx.lineTo(-37, -2);
        ctx.moveTo(-65, 0);
        ctx.lineTo(-37, 2);
        ctx.strokeStyle = '#2bff7e';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();

        // SCORE
        ctx.fillStyle = '#2bff7e';
        ctx.font = '16px monospace';
        ctx.fillText('SCORE: ' + score, 16, 24);

        requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
</script>
</body>

<footer>
 <span> AMASS AIRSHIP CONTROL SIM v0.1</span>
 <span> H. LING </span>
</footer>

</html>
